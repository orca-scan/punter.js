<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <defs>
    <radialGradient id="skinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffa726"/>
    </radialGradient>
  </defs>
  <!-- legs -->
  <rect x="7" y="32" width="7" height="16" rx="3" fill="#1565c0"/>
  <rect x="18" y="32" width="7" height="16" rx="3" fill="#1565c0"/>
  <!-- shoes -->
  <ellipse cx="10.5" cy="47" rx="5" ry="2.5" fill="#212121"/>
  <ellipse cx="21.5" cy="47" rx="5" ry="2.5" fill="#212121"/>
  <!-- torso -->
  <rect x="6" y="16" width="20" height="18" rx="6" fill="#1e88e5"/>
  <!-- chest star emblem -->
  <polygon points="16,19 17.5,23 22,23 18.5,26 20,30 16,27 12,30 13.5,26 10,23 14.5,23" fill="#fff176" opacity="0.9"/>
  <!-- arms -->
  <rect x="1" y="16" width="6" height="14" rx="3" fill="#1e88e5"/>
  <rect x="25" y="16" width="6" height="14" rx="3" fill="#1e88e5"/>
  <!-- head -->
  <circle cx="16" cy="11" r="9" fill="url(#skinGrad)"/>
  <!-- hair -->
  <path d="M8,9 Q8,2 16,2 Q24,2 24,9" fill="#5d4037"/>
  <!-- eyes -->
  <circle cx="13" cy="10" r="2" fill="#fff"/>
  <circle cx="19" cy="10" r="2" fill="#fff"/>
  <circle cx="13.5" cy="10.5" r="1.1" fill="#1a237e"/>
  <circle cx="19.5" cy="10.5" r="1.1" fill="#1a237e"/>
  <!-- smile -->
  <path d="M12,15 Q16,18 20,15" stroke="#5d4037" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
