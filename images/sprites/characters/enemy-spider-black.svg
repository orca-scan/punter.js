<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 30" width="44" height="30">
  <!-- legs left side -->
  <line x1="22" y1="14" x2="2" y2="3" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="0" y2="14" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="2" y2="25" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="8" y2="29" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <!-- legs right side -->
  <line x1="22" y1="14" x2="42" y2="3" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="44" y2="14" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="42" y2="25" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="36" y2="29" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <!-- abdomen -->
