  <circle cx="19" cy="8" r="1.5" fill="#69f0ae"/>
  <circle cx="22" cy="8" r="1.5" fill="#69f0ae"/>
  <circle cx="25" cy="8" r="1.5" fill="#69f0ae"/>
  <!-- fangs -->
