<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#546e7a"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <rect x="14" y="0" width="4" height="6" rx="2" fill="#90a4ae"/>
  <circle cx="16" cy="1" r="3" fill="#ffee58"/>
  <!-- head -->
  <rect x="4" y="5" width="24" height="14" rx="3" fill="url(#metalGrad)"/>
  <!-- eye visor -->
  <rect x="7" y="8" width="18" height="7" rx="2" fill="#b0bec5"/>
  <!-- eyes -->
  <circle cx="13" cy="11.5" r="2.5" fill="#f44336"/>
  <circle cx="19" cy="11.5" r="2.5" fill="#f44336"/>
  <circle cx="13" cy="11.5" r="1" fill="#ff8a80"/>
  <circle cx="19" cy="11.5" r="1" fill="#ff8a80"/>
  <!-- neck -->
  <rect x="12" y="19" width="8" height="5" fill="#607d8b"/>
  <!-- torso -->
  <rect x="4" y="24" width="24" height="18" rx="4" fill="url(#metalGrad)"/>
  <!-- chest panel -->
  <rect x="8" y="27" width="16" height="10" rx="2" fill="#455a64"/>
  <!-- status lights -->
  <circle cx="12" cy="32" r="2" fill="#f44336"/>
  <circle cx="16" cy="32" r="2" fill="#ffee58"/>
  <circle cx="20" cy="32" r="2" fill="#69f0ae"/>
  <!-- arms -->
  <rect x="0" y="24" width="5" height="16" rx="2" fill="url(#metalGrad)"/>
  <rect x="27" y="24" width="5" height="16" rx="2" fill="url(#metalGrad)"/>
  <!-- gripper hands -->
  <circle cx="2.5" cy="41" r="3" fill="#546e7a"/>
  <circle cx="29.5" cy="41" r="3" fill="#546e7a"/>
  <!-- legs -->
  <rect x="7" y="42" width="7" height="6" rx="2" fill="#546e7a"/>
  <rect x="18" y="42" width="7" height="6" rx="2" fill="#546e7a"/>
  <!-- feet -->
  <rect x="4" y="45" width="11" height="4" rx="2" fill="#455a64"/>
  <rect x="17" y="45" width="11" height="4" rx="2" fill="#455a64"/>
