<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <defs>
    <radialGradient id="skinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="100%" stop-color="#7cb342"/>
    </radialGradient>
  </defs>
  <!-- legs -->
  <rect x="7" y="32" width="7" height="16" rx="2" fill="#33691e"/>
  <rect x="18" y="32" width="7" height="16" rx="2" fill="#33691e"/>
  <!-- ragged shoes -->
  <ellipse cx="9" cy="47" rx="6" ry="2.5" fill="#1b1b1b"/>
  <ellipse cx="22" cy="47" rx="6" ry="2.5" fill="#1b1b1b"/>
  <!-- torn shirt body -->
  <rect x="6" y="16" width="20" height="18" rx="4" fill="#78909c"/>
  <!-- shirt tear lines -->
  <line x1="10" y1="16" x2="12" y2="30" stroke="#546e7a" stroke-width="1.5"/>
  <line x1="22" y1="20" x2="20" y2="32" stroke="#546e7a" stroke-width="1.5"/>
  <!-- arms stretched out -->
  <rect x="-1" y="16" width="8" height="5" rx="2" fill="#558b2f"/>
  <rect x="25" y="16" width="8" height="5" rx="2" fill="#558b2f"/>
  <!-- hands -->
  <circle cx="1" cy="18" r="4" fill="#558b2f"/>
  <circle cx="31" cy="18" r="4" fill="#558b2f"/>
  <!-- head -->
  <circle cx="16" cy="11" r="9" fill="url(#skinGrad)"/>
  <!-- head wound -->
  <path d="M11,5 Q13,3 15,5 Q17,3 19,5" stroke="#b71c1c" stroke-width="1.5" fill="none"/>
  <!-- hollow zombie eyes -->
  <circle cx="13" cy="11" r="3" fill="#fff"/>
  <circle cx="19" cy="11" r="3" fill="#fff"/>
  <circle cx="13" cy="11" r="1.5" fill="#b0bec5" opacity="0.4"/>
  <circle cx="19" cy="11" r="1.5" fill="#b0bec5" opacity="0.4"/>
  <!-- teeth -->
  <rect x="12" y="17" width="2.5" height="3" rx="1" fill="#fff"/>
  <rect x="15.5" y="17" width="2.5" height="3" rx="1" fill="#fff"/>
  <rect x="19" y="17" width="2.5" height="3" rx="1" fill="#fff"/>
</svg>
