<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 56" width="32" height="56">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf360c"/>
      <stop offset="40%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
  </defs>
  <!-- engine flames -->
  <ellipse cx="16" cy="53" rx="6" ry="4" fill="#ff6f00" opacity="0.7"/>
  <ellipse cx="16" cy="52" rx="4" ry="3.5" fill="#ff9800"/>
  <ellipse cx="16" cy="51" rx="2.5" ry="2.5" fill="#fff176"/>
  <!-- fins -->
  <polygon points="6,42 0,54 12,46" fill="#bf360c"/>
  <polygon points="26,42 32,54 20,46" fill="#bf360c"/>
  <!-- body -->
  <rect x="8" y="16" width="16" height="30" rx="4" fill="url(#rocketGrad)"/>
  <!-- body highlight -->
  <rect x="10" y="16" width="5" height="30" rx="3" fill="#ff8a65" opacity="0.4"/>
  <!-- nose cone -->
  <polygon points="16,2 24,18 8,18" fill="#e64a19"/>
  <!-- nose tip -->
  <polygon points="16,2 20,12 12,12" fill="#bf360c"/>
  <!-- porthole window -->
  <circle cx="16" cy="29" r="5" fill="#b3e5fc"/>
  <circle cx="15" cy="28" r="2" fill="#e1f5fe" opacity="0.8"/>
  <!-- rivet lines -->
  <rect x="7" y="25" width="2" height="10" rx="1" fill="#e64a19" opacity="0.5"/>
  <rect x="23" y="25" width="2" height="10" rx="1" fill="#e64a19" opacity="0.5"/>
</svg>
