<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <!-- car body -->
  <rect x="3" y="6" width="26" height="36" rx="8" fill="url(#bodyGrad)"/>
  <!-- windshield -->
  <rect x="6" y="10" width="20" height="10" rx="4" fill="#b3e5fc" opacity="0.85"/>
  <!-- cabin roof -->
  <rect x="8" y="13" width="16" height="10" rx="3" fill="#c62828"/>
  <!-- rear window -->
  <rect x="6" y="28" width="20" height="8" rx="3" fill="#b3e5fc" opacity="0.7"/>
  <!-- front left wheel -->
  <rect x="0" y="8" width="6" height="10" rx="3" fill="#212121"/>
  <rect x="1" y="10" width="4" height="6" rx="2" fill="#424242"/>
  <!-- front right wheel -->
  <rect x="26" y="8" width="6" height="10" rx="3" fill="#212121"/>
  <rect x="27" y="10" width="4" height="6" rx="2" fill="#424242"/>
  <!-- rear left wheel -->
  <rect x="0" y="30" width="6" height="10" rx="3" fill="#212121"/>
  <rect x="1" y="32" width="4" height="6" rx="2" fill="#424242"/>
  <!-- rear right wheel -->
  <rect x="26" y="30" width="6" height="10" rx="3" fill="#212121"/>
  <rect x="27" y="32" width="4" height="6" rx="2" fill="#424242"/>
  <!-- headlights -->
  <rect x="5" y="6" width="7" height="4" rx="2" fill="#fff9c4"/>
  <rect x="20" y="6" width="7" height="4" rx="2" fill="#fff9c4"/>
  <!-- tail lights -->
  <rect x="5" y="40" width="7" height="4" rx="2" fill="#ff1744"/>
  <rect x="20" y="40" width="7" height="4" rx="2" fill="#ff1744"/>
  <!-- racing stripe -->
  <rect x="14" y="6" width="4" height="36" fill="#fff" opacity="0.25"/>
</svg>
