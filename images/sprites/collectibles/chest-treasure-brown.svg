<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 34" width="44" height="34">
  <!-- chest base -->
  <rect x="2" y="16" width="40" height="16" rx="3" fill="#4e342e"/>
  <!-- chest base planks -->
  <rect x="2" y="20" width="40" height="2" fill="#3e2723" opacity="0.6"/>
  <rect x="2" y="25" width="40" height="2" fill="#3e2723" opacity="0.6"/>
  <!-- chest lid -->
  <rect x="2" y="6" width="40" height="12" rx="3" fill="#6d4c41"/>
  <!-- lid highlight -->
  <rect x="4" y="8" width="36" height="5" rx="2" fill="#795548" opacity="0.7"/>
  <!-- gold band horizontal -->
  <rect x="0" y="14" width="44" height="4" rx="1" fill="#fbc02d"/>
  <!-- gold band vertical -->
  <rect x="18" y="6" width="8" height="22" rx="2" fill="#fbc02d"/>
  <!-- lock plate -->
  <circle cx="22" cy="15" r="5" fill="#f9a825"/>
  <circle cx="22" cy="15" r="3" fill="#e65100"/>
  <!-- coins spilling from lid -->
  <circle cx="12" cy="9" r="3" fill="#ffd600"/>
  <circle cx="30" cy="8" r="3" fill="#ffd600"/>
  <circle cx="22" cy="5" r="3" fill="#ffd600"/>
  <!-- coin shine -->
  <circle cx="11" cy="8" r="1" fill="#fff9c4" opacity="0.7"/>
</svg>
