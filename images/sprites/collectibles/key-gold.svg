<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 40" width="20" height="40">
  <defs>
    <radialGradient id="keyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#f57f17"/>
