  <!-- top right facet -->
  <polygon points="12,2 22,10 12,14" fill="#42a5f5"/>
  <!-- bottom left facet -->
  <polygon points="2,10 12,28 12,14" fill="#1565c0"/>
  <!-- bottom right facet -->
  <polygon points="22,10 12,28 12,14" fill="#0d47a1"/>
  <!-- top horizontal edge highlight -->
