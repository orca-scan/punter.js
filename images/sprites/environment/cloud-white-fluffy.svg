<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36" width="60" height="36">
  <defs>
    <radialGradient id="cloudGrad" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="80%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
  </defs>
  <!-- soft shadow -->
  <ellipse cx="31" cy="31" rx="24" ry="5" fill="#b0bec5" opacity="0.2"/>
  <!-- cloud puffs -->
  <circle cx="14" cy="26" r="9" fill="#f5f5f5"/>
  <circle cx="26" cy="20" r="13" fill="url(#cloudGrad)"/>
  <circle cx="38" cy="20" r="13" fill="url(#cloudGrad)"/>
  <circle cx="48" cy="25" r="10" fill="#f5f5f5"/>
  <!-- fill gap at bottom -->
  <rect x="5" y="26" width="50" height="8" fill="#f5f5f5"/>
  <!-- top highlight puffs -->
  <circle cx="24" cy="16" r="6" fill="#fff" opacity="0.7"/>
  <circle cx="34" cy="13" r="7" fill="#fff" opacity="0.6"/>
</svg>
