  <!-- dirt texture -->
  <rect x="3" y="14" width="7" height="1.5" rx="0.5" fill="#5d4037" opacity="0.6"/>
  <rect x="14" y="19" width="8" height="1.5" rx="0.5" fill="#5d4037" opacity="0.6"/>
  <rect x="22" y="14" width="7" height="1.5" rx="0.5" fill="#5d4037" opacity="0.6"/>
  <rect x="5" y="23" width="8" height="1.5" rx="0.5" fill="#5d4037" opacity="0.6"/>
  <!-- grass surface -->
