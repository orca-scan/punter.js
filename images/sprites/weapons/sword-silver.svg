<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 48" width="16" height="48">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="40%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
  </defs>
  <!-- blade tip -->
  <polygon points="8,1 10,7 6,7" fill="#cfd8dc"/>
  <!-- blade body -->
  <rect x="6.5" y="6" width="3" height="27" fill="url(#bladeGrad)"/>
  <!-- blade edge -->
  <rect x="6" y="6" width="1" height="27" fill="#90a4ae"/>
  <!-- crossguard -->
  <rect x="1" y="32" width="14" height="3.5" rx="1.5" fill="#fbc02d"/>
  <!-- handle grip -->
  <rect x="6" y="35" width="4" height="10" rx="2" fill="#795548"/>
  <!-- handle wrapping -->
  <line x1="6" y1="37" x2="10" y2="37" stroke="#5d4037" stroke-width="1"/>
  <line x1="6" y1="39" x2="10" y2="39" stroke="#5d4037" stroke-width="1"/>
  <line x1="6" y1="41" x2="10" y2="41" stroke="#5d4037" stroke-width="1"/>
  <!-- pommel -->
  <circle cx="8" cy="46" r="3" fill="#fbc02d"/>
  <circle cx="8" cy="46" r="1.5" fill="#f57f17"/>
</svg>
