<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Build Asteroids in JavaScript - Beginner Game Example | Punter.js</title>
    <meta name="description" content="Play, edit and learn from an Asteroids game built with JavaScript and Punter.js">
    <link rel="canonical" href="https://punterjs.org/games/asteroids">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #000010;
        overflow: hidden;
        touch-action: none;
      }
    </style>
    <script src="../src/punter.js"></script>
  </head>
  <body>
    <a href="../studio/?game=asteroids" style="position:fixed;top:10px;right:10px;z-index:9999;background:#373B3F;color:#f6f6f6;padding:6px 12px;border-radius:6px;font:13px/1 sans-serif;text-decoration:none;border:1px solid #666">Edit the code ✨</a>
    <canvas id="game"></canvas>
    <script>

      // =========================================================
      // COLORS
      // =========================================================
      var COLOR_SHIP     = '#00ffcc';
      var COLOR_THRUST   = '#ff6600';
      var COLOR_BULLET   = '#ffff44';
      var COLOR_ASTEROID = '#8899aa';
      var COLOR_AST_FILL = 'rgba(14,22,34,0.8)';
      var COLOR_TEXT     = '#ffffff';
      var COLOR_DIM      = '#445566';

      // =========================================================
      // SETTINGS
      // =========================================================
      var SHIP_SIZE         = 18;
      var SHIP_TURN         = 0.065;        // radians per frame
      var SHIP_THRUST       = 0.18;
      var SHIP_FRICTION     = 0.97;
      var BULLET_SPEED      = 11;
      var BULLET_SIZE       = 6;
      var BULLET_LIFE       = 55;           // frames before bullet disappears
      var MAX_BULLETS       = 5;
      var SHOOT_COOLDOWN    = 11;           // frames between shots
      var INVINCIBLE_FRAMES = 180;          // frames of invincibility after death
      var AST_RADII         = [50, 28, 14]; // large, medium, small
      var AST_BASE_SPEEDS   = [0.8, 1.4, 2.2];
      var AST_SCORES        = [20, 50, 100];
      var INIT_ASTEROIDS    = 4;
      var STAR_COUNT        = 80;

      // =========================================================
      // STATE
      // =========================================================
      var ship, stars;
      var asteroids     = [];
      var bullets       = [];
      var score, lives, level, gameOver, invTimer, shootTimer;
      var particles, popups, levelAnnounce;
      var highScore = parseInt(localStorage.getItem('ast_hi'), 10) || 0;

      // =========================================================
      // SETUP
      // =========================================================
      punter.setup({
        canvas: '#game',
        debug: false,
        sounds: {
          shoot:   '../sounds/cannon1.mp3',
          hitBig:  '../sounds/punch1.mp3',
          hitMed:  '../sounds/punch2.mp3',
          hitSml:  '../sounds/bling1.mp3',
          die:     '../sounds/error1.mp3',
          levelup: '../sounds/fanfare1.mp3',
          over:    '../sounds/error3.mp3'
        }
      });

      // =========================================================
      // SCENE: play
      // =========================================================
      punter.scene('play', function () {

        resetGame();

        punter.on('resize', function () {
          buildStars(punter.width, punter.height);
        });

        punter.on('update', function () {
          var w = punter.width;
          var h = punter.height;

          // ---- game over ----
          if (gameOver) {
            if (punter.isKeyDown('space') || punter.pointer.clicked) {
              punter.clearInput();
              resetGame();
            }
            return;
          }

          // ---- rotate ship ----
          if (punter.isKeyDown('left', 'a')) ship.angle -= SHIP_TURN;
          if (punter.isKeyDown('right', 'd')) ship.angle += SHIP_TURN;

          // ---- thrust ----
          ship.thrusting = punter.isKeyDown('up', 'w');
          if (ship.thrusting) {
            ship.vx += Math.cos(ship.angle) * SHIP_THRUST;
            ship.vy += Math.sin(ship.angle) * SHIP_THRUST;
          }

          // ---- touch controls: top zone = thrust, left/right zones = rotate ----
          if (punter.isPointerDown()) {
            var tx = punter.pointer.x;
            var ty = punter.pointer.y;
            if (ty < h * 0.35) {
              ship.thrusting = true;
              ship.vx += Math.cos(ship.angle) * SHIP_THRUST;
              ship.vy += Math.sin(ship.angle) * SHIP_THRUST;
            } else if (tx < w * 0.4) {
              ship.angle -= SHIP_TURN;
            } else if (tx > w * 0.6) {
              ship.angle += SHIP_TURN;
            }
          }
          ship.vx *= SHIP_FRICTION;
          ship.vy *= SHIP_FRICTION;
          ship.x = wrap(ship.x + ship.vx, w);
          ship.y = wrap(ship.y + ship.vy, h);

          // ---- shoot ----
          if (shootTimer > 0) shootTimer--;
          if (shootTimer === 0 && (punter.isKeyDown('space') || punter.pointer.clicked) && bullets.length < MAX_BULLETS) {
            fireBullet();
            punter.clearInput();
          }

          // ---- move bullets ----
          for (var i = bullets.length - 1; i >= 0; i--) {
            var blt = bullets[i];
            blt.x = wrap(blt.x + blt.vx, w);
            blt.y = wrap(blt.y + blt.vy, h);
            if (--blt.life <= 0) {
              blt.destroy();
              bullets.splice(i, 1);
            }
          }

          // ---- move and spin asteroids ----
          for (var i = 0; i < asteroids.length; i++) {
            asteroids[i].x = wrap(asteroids[i].x + asteroids[i].vx, w);
            asteroids[i].y = wrap(asteroids[i].y + asteroids[i].vy, h);
            asteroids[i].rotate(asteroids[i].spinSpeed);
          }

          // ---- bullet vs asteroid ----
          for (var bi = bullets.length - 1; bi >= 0; bi--) {
            for (var ai = asteroids.length - 1; ai >= 0; ai--) {
              if (bullets[bi].isCollidingWith(asteroids[ai])) {
                var hit    = asteroids.splice(ai, 1)[0];
                var hitBlt = bullets.splice(bi, 1)[0];
                var cx     = hit.x + hit.w / 2;
                var cy     = hit.y + hit.h / 2;
                hit.destroy();
                hitBlt.destroy();
                score += AST_SCORES[hit.size];
                spawnFragments(hit);
                punter.playSound(hit.size === 0 ? 'hitBig' : hit.size === 1 ? 'hitMed' : 'hitSml');
                spawnDebris(cx, cy, hit.size);
                addPopup(cx, cy, '+' + AST_SCORES[hit.size]);
                break;
              }
            }
          }

          // ---- ship vs asteroid ----
          if (invTimer > 0) {
            invTimer--;
          } else {
            for (var ai = 0; ai < asteroids.length; ai++) {
              if (ship.isCollidingWith(asteroids[ai])) {
                lives--;
                invTimer = INVINCIBLE_FRAMES;
                ship.blink(130, INVINCIBLE_FRAMES * (1000 / 60));
                ship.vx  = 0;
                ship.vy  = 0;
                ship.x   = w / 2 - SHIP_SIZE;
                ship.y   = h / 2 - SHIP_SIZE;
                punter.playSound('die');
                if (lives <= 0) {
                  gameOver = true;
                  if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ast_hi', String(highScore));
                  }
                  punter.playSound('over');
                }
                break;
              }
            }
          }

          // ---- next level ----
          if (asteroids.length === 0) {
            level++;
            punter.playSound('levelup');
            spawnAsteroids(w, h, INIT_ASTEROIDS + level - 1);
            levelAnnounce = 120;
          }

          // ---- update particles ----
          for (var pi = particles.length - 1; pi >= 0; pi--) {
            particles[pi].x = wrap(particles[pi].x + particles[pi].vx, w);
            particles[pi].y = wrap(particles[pi].y + particles[pi].vy, h);
            if (--particles[pi].life <= 0) particles.splice(pi, 1);
          }

          // ---- update popups ----
          for (var po = popups.length - 1; po >= 0; po--) {
            popups[po].y -= 0.6;
            if (--popups[po].life <= 0) popups.splice(po, 1);
          }

          if (levelAnnounce > 0) levelAnnounce--;
        });

        // ship, asteroids and bullets are vector sprites — the engine draws them automatically.
        // the draw handler only needs to handle the background, particles, and UI.
        punter.on('draw', function (ctx) {
          var w = punter.width;
          var h = punter.height;

          drawStars(ctx);
          drawParticles(ctx);
          drawHUD(ctx, w, h);
          drawPopups(ctx);
          if (levelAnnounce > 0) drawLevelAnnounce(ctx, w, h);
          if (gameOver) drawGameOver(ctx, w, h);
        });
      });

      // =========================================================
      // GAME ACTIONS
      // =========================================================

      /**
       * Fires a bullet sprite from the ship nose in the facing direction
       */
      function fireBullet() {
        // compute the nose of the ship in world coordinates
        var noseX = ship.x + SHIP_SIZE + Math.cos(ship.angle) * SHIP_SIZE;
        var noseY = ship.y + SHIP_SIZE + Math.sin(ship.angle) * SHIP_SIZE;

        var bullet = punter.createSprite({
          x: noseX - BULLET_SIZE / 2,
          y: noseY - BULLET_SIZE / 2,
          w: BULLET_SIZE,
          h: BULLET_SIZE,
          vector: function (ctx, w, h) {
            ctx.fillStyle = COLOR_BULLET;
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        bullet.vx   = Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.5;
        bullet.vy   = Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.5;
        bullet.life = BULLET_LIFE;
        bullets.push(bullet);

        shootTimer = SHOOT_COOLDOWN;
        punter.playSound('shoot');
      }

      /**
       * Breaks an asteroid sprite into two smaller fragment sprites
       */
      function spawnFragments(hit) {
        if (hit.size >= 2) return;
        var nextSize = hit.size + 1;
        var cx       = hit.x + hit.w / 2;
        var cy       = hit.y + hit.h / 2;
        var baseDir  = Math.atan2(hit.vy, hit.vx);
        for (var i = 0; i < 2; i++) {
          var spread = (Math.PI / 4) * (i === 0 ? 1 : -1);
          var spd    = AST_BASE_SPEEDS[nextSize] * (0.7 + Math.random() * 0.6);
          var frag   = makeAsteroid(cx, cy, nextSize);
          frag.vx = Math.cos(baseDir + spread) * spd;
          frag.vy = Math.sin(baseDir + spread) * spd;
          asteroids.push(frag);
        }
      }

      /**
       * Spawns debris particles at the position where an asteroid was destroyed
       */
      function spawnDebris(x, y, size) {
        var count = 6 + (2 - size) * 3;
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 0.8 + Math.random() * 2.5;
          particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.floor(Math.random() * 20),
            maxLife: 40
          });
        }
      }

      /**
       * Adds a floating score popup at the given position
       */
      function addPopup(x, y, text) {
        popups.push({ x: x, y: y, text: text, life: 40, maxLife: 40 });
      }

      // =========================================================
      // SPAWN / RESET
      // =========================================================

      /**
       * Spawns count large asteroid sprites at random positions away from the canvas centre
       */
      function spawnAsteroids(w, h, count) {
        for (var i = 0; i < count; i++) {
          var x, y;
          do {
            x = Math.random() * w;
            y = Math.random() * h;
          } while (dist2(x, y, w / 2, h / 2) < sqr(120));
          asteroids.push(makeAsteroid(x, y, 0));
        }
      }

      /**
       * Creates and returns an asteroid vector sprite with a random jagged shape.
       * The engine draws it and tracks its bounding box automatically.
       * @param {number} x - centre x position
       * @param {number} y - centre y position
       * @param {number} size - 0 = large, 1 = medium, 2 = small
       */
      function makeAsteroid(x, y, size) {
        var r      = AST_RADII[size];
        var numPts = 9 + Math.floor(Math.random() * 4);
        var pts    = [];
        for (var i = 0; i < numPts; i++) {
          var a   = (i / numPts) * Math.PI * 2;
          var jag = r * (0.65 + Math.random() * 0.5);
          pts.push({ x: Math.cos(a) * jag, y: Math.sin(a) * jag });
        }

        var asteroid = punter.createSprite({
          x: x - r,  // top-left: centre minus radius
          y: y - r,
          w: r * 2,
          h: r * 2,
          vector: function (ctx, w, h) {
            // translate to sprite centre then rotate using the engine-managed angle
            ctx.translate(w / 2, h / 2);
            ctx.rotate(this.angle);
            ctx.strokeStyle = COLOR_ASTEROID;
            ctx.fillStyle   = COLOR_AST_FILL;
            ctx.lineWidth   = 2;
            ctx.lineJoin    = 'round';
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        });

        var speed = AST_BASE_SPEEDS[size] * (0.5 + Math.random() * 0.6);
        var dir   = Math.random() * Math.PI * 2;
        asteroid.vx        = Math.cos(dir) * speed;
        asteroid.vy        = Math.sin(dir) * speed;
        asteroid.size      = size;
        asteroid.spinSpeed = (Math.random() - 0.5) * 0.04;

        return asteroid;
      }

      /**
       * Generates random star positions for the background
       */
      function buildStars(w, h) {
        stars = [];
        var seed = 54321;
        for (var i = 0; i < STAR_COUNT; i++) {
          seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
          var sx = seed % w;
          seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
          var sy = seed % h;
          seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
          var alpha = 0.2 + (seed % 80) / 100;
          stars.push({ x: sx, y: sy, a: alpha });
        }
      }

      /**
       * Resets all game state and sprites ready for a new game
       */
      function resetGame() {
        var w = punter.width  || 375;
        var h = punter.height || 667;

        // destroy sprites from any previous game
        for (var i = 0; i < asteroids.length; i++) asteroids[i].destroy();
        for (var i = 0; i < bullets.length; i++) bullets[i].destroy();
        var existingShip = punter.getSprite('ship');
        if (existingShip) existingShip.destroy();

        // the ship is a vector sprite — the engine draws and tracks its bounds automatically
        ship = punter.createSprite({
          id: 'ship',
          x: w / 2 - SHIP_SIZE,  // top-left: centre minus half-size
          y: h / 2 - SHIP_SIZE,
          w: SHIP_SIZE * 2,
          h: SHIP_SIZE * 2,
          collidable: true,
          vector: function (ctx) {
            // translate to the sprite centre before rotating
            ctx.translate(SHIP_SIZE, SHIP_SIZE);
            ctx.rotate(this.angle + Math.PI / 2);
            ctx.strokeStyle = COLOR_SHIP;
            ctx.lineWidth   = 2;
            ctx.lineJoin    = 'round';

            // ship body
            ctx.beginPath();
            ctx.moveTo(0, -SHIP_SIZE);
            ctx.lineTo(SHIP_SIZE * 0.55, SHIP_SIZE * 0.75);
            ctx.lineTo(0, SHIP_SIZE * 0.35);
            ctx.lineTo(-SHIP_SIZE * 0.55, SHIP_SIZE * 0.75);
            ctx.closePath();
            ctx.stroke();

            // thrust flame (flickers every other frame)
            if (this.thrusting && punter.frame % 2 === 0) {
              var fl = SHIP_SIZE * (1.0 + Math.random() * 0.5);
              ctx.strokeStyle = COLOR_THRUST;
              ctx.beginPath();
              ctx.moveTo(-SHIP_SIZE * 0.22, SHIP_SIZE * 0.5);
              ctx.lineTo(0, SHIP_SIZE * 0.35 + fl);
              ctx.lineTo(SHIP_SIZE * 0.22, SHIP_SIZE * 0.5);
              ctx.stroke();
            }
          }
        });

        ship.vx        = 0;
        ship.vy        = 0;
        ship.angle     = -Math.PI / 2; // pointing up
        ship.thrusting = false;

        asteroids     = [];
        bullets       = [];
        score         = 0;
        lives         = 3;
        level         = 1;
        gameOver      = false;
        invTimer      = 0;
        shootTimer    = 0;
        particles     = [];
        popups        = [];
        levelAnnounce = 0;

        buildStars(w, h);
        spawnAsteroids(w, h, INIT_ASTEROIDS);
      }

      // =========================================================
      // DRAW HELPERS  (HUD, particles and effects only)
      // =========================================================

      function drawStars(ctx) {
        if (!stars) return;
        for (var i = 0; i < stars.length; i++) {
          ctx.fillStyle = 'rgba(255,255,255,' + stars[i].a + ')';
          ctx.fillRect(stars[i].x, stars[i].y, 1, 1);
        }
      }

      function drawHUD(ctx, w, h) {
        var pad = 16;

        ctx.textBaseline = 'top';
        ctx.font         = 'bold 16px monospace';
        ctx.fillStyle    = COLOR_TEXT;
        ctx.textAlign    = 'left';
        ctx.fillText(score, pad, pad);

        if (highScore > 0) {
          ctx.fillStyle = COLOR_DIM;
          ctx.font      = '11px monospace';
          ctx.fillText('HI ' + highScore, pad, pad + 20);
        }

        ctx.textAlign = 'right';
        ctx.fillText('LVL ' + level, w - pad, pad);

        // life icons centred at the top
        for (var i = 0; i < lives; i++) {
          ctx.save();
          ctx.translate(w / 2 + (i - (lives - 1) / 2) * 22, 20);
          ctx.rotate(-Math.PI / 2);
          ctx.strokeStyle = COLOR_SHIP;
          ctx.lineWidth   = 1.5;
          ctx.lineJoin    = 'round';
          var s = 7;
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.lineTo(s * 0.55, s * 0.75);
          ctx.lineTo(0, s * 0.35);
          ctx.lineTo(-s * 0.55, s * 0.75);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        ctx.fillStyle    = COLOR_DIM;
        ctx.font         = '12px monospace';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'bottom';
        var hint = punter.isMobile
          ? 'Top: thrust  \u00b7  L/R: rotate  \u00b7  Tap: fire'
          : 'ARROWS / WASD  \u00b7  SPACE to fire';
        ctx.fillText(hint, w / 2, h - 10);

        ctx.fillStyle    = COLOR_DIM;
        ctx.font         = '12px monospace';
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('Created by Charlie Crofts', w - pad, h - 10);
      }

      function drawGameOver(ctx, w, h) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, w, h);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = COLOR_TEXT;
        ctx.font         = 'bold 40px monospace';
        ctx.fillText('GAME OVER', w / 2, h / 2 - 32);
        ctx.font = '20px monospace';
        ctx.fillText('Score: ' + score, w / 2, h / 2 + 10);
        ctx.fillStyle = COLOR_DIM;
        ctx.font      = '14px monospace';
        ctx.fillText('Best: ' + highScore, w / 2, h / 2 + 36);
        ctx.fillText('Press SPACE or tap to restart', w / 2, h / 2 + 58);
      }

      function drawParticles(ctx) {
        for (var i = 0; i < particles.length; i++) {
          var p     = particles[i];
          var alpha = p.life / p.maxLife;
          ctx.fillStyle = 'rgba(136,153,170,' + alpha + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, (0.5 + alpha) * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPopups(ctx) {
        ctx.save();
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.font         = 'bold 13px monospace';
        for (var i = 0; i < popups.length; i++) {
          var p         = popups[i];
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fillStyle   = COLOR_BULLET;
          ctx.fillText(p.text, p.x, p.y);
        }
        ctx.restore();
      }

      function drawLevelAnnounce(ctx, w, h) {
        var alpha;
        if (levelAnnounce > 90) {
          alpha = (120 - levelAnnounce) / 30;
        } else if (levelAnnounce > 30) {
          alpha = 1;
        } else {
          alpha = levelAnnounce / 30;
        }
        ctx.save();
        ctx.globalAlpha  = alpha;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = COLOR_TEXT;
        ctx.font         = 'bold 32px monospace';
        ctx.fillText('LEVEL ' + level, w / 2, h / 2);
        ctx.restore();
      }

      // =========================================================
      // MATH HELPERS
      // =========================================================

      /** Wraps v within [0, max) */
      function wrap(v, max) {
        if (v < 0)    return v + max;
        if (v >= max) return v - max;
        return v;
      }

      /** Squared distance between two points — used for the asteroid spawn safe zone */
      function dist2(x1, y1, x2, y2) {
        return (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      }

      /** Squares a number */
      function sqr(x) {
        return x * x;
      }

      punter.go('play');

    </script>
  </body>
</html>
