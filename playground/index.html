<!doctype html>
<html lang="en" data-appearance="dark">

<head>
  <title>Punter.js Playground</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit JavaScript and run a Punter.js game right in your browser. No install required.">

  <!-- CodeMirror 5 styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* --- design tokens (match punterjs.org) --- */
    html {
      --app-background-color: #2C3033;
      --app-foreground-color: #1b2125;
      --app-text-color-primary: #f6f6f6;
      --app-text-color-secondary: #96989C;
      --app-border-color-primary: #373b3f;
      --primary-button-background-color: #EFD063;
      --primary-button-border-color: #EFD063;
      --primary-button-background-color-hover: #F3CB3C;
      --secondary-button-background-color: #373B3F;
      --secondary-button-border-color: #666666;
      --secondary-button-background-color-hover: #666666;
      --font-family-system: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-family-headers: 'Poppins', sans-serif;
      --font-family-mono: 'Fira Mono', 'Fira Code', 'Cascadia Mono', 'Consolas', 'Menlo', monospace;
      --error-color: #ff6b6b;
      --warn-color: #EFD063;
      --log-color: #96989C;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--app-background-color);
      font-family: var(--font-family-system);
      color: var(--app-text-color-secondary);
    }

    /* --- layout --- */

    .pg-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--app-border-color-primary);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--app-foreground-color);
    }

    .pg-title {
      font-family: var(--font-family-headers);
      font-size: 16px;
      font-weight: 600;
      color: var(--app-text-color-primary);
      white-space: nowrap;
    }

    .pg-title a {
      color: inherit;
      text-decoration: none;
    }

    .pg-title a:hover {
      text-decoration: underline;
    }

    .pg-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .pg-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pg-select-wrap label {
      font-size: 13px;
      color: var(--app-text-color-secondary);
      white-space: nowrap;
    }

    select {
      background: var(--app-background-color);
      color: var(--app-text-color-primary);
      border: 1px solid var(--secondary-button-border-color);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--font-family-system);
      cursor: pointer;
    }

    select:focus-visible {
      outline: 2px solid var(--primary-button-background-color);
      outline-offset: 2px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .btn {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: var(--font-family-system);
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary-button-background-color);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--primary-button-background-color);
      border-color: var(--primary-button-border-color);
      color: #1b2125;
    }

    .btn-primary:hover {
      background: var(--primary-button-background-color-hover);
    }

    .btn-secondary {
      background: var(--secondary-button-background-color);
      border-color: var(--secondary-button-border-color);
      color: var(--app-text-color-primary);
    }

    .btn-secondary:hover {
      background: var(--secondary-button-background-color-hover);
    }

    /* --- main split layout --- */

    .pg-body {
      display: grid;
      /* desktop: preview | editor side by side */
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      height: calc(100vh - 53px); /* full height minus header */
    }

    /* --- preview pane --- */

    .pg-preview {
      background: #1b2125;
      border-right: 1px solid var(--app-border-color-primary);
      position: relative;
      overflow: hidden;
      min-height: 240px;
    }

    .pg-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pg-preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--app-text-color-secondary);
      font-size: 14px;
      pointer-events: none;
    }

    /* --- editor pane --- */

    .pg-editor-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pg-editor-wrap {
      flex: 1;
      min-height: 0; /* allow flex children to shrink below content height */
      overflow: hidden;
      position: relative;
    }

    /* textarea: visible as fallback when CodeMirror is unavailable */
    #pg-textarea {
      width: 100%;
      height: 100%;
      background: var(--app-foreground-color);
      color: var(--app-text-color-primary);
      border: none;
      padding: 14px;
      font-family: var(--font-family-mono);
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    #pg-textarea:focus-visible {
      outline: 2px solid var(--primary-button-background-color);
      outline-offset: -2px;
    }

    /* CodeMirror 5 fills the editor pane */
    .CodeMirror {
      height: 100%;
      font-family: var(--font-family-mono);
      font-size: 13px;
      line-height: 1.6;
      background: var(--app-foreground-color);
    }

    .CodeMirror-scroll {
      height: 100%;
    }

    /* --- output / error area --- */

    .pg-output {
      background: var(--app-foreground-color);
      border-top: 1px solid var(--app-border-color-primary);
      max-height: 140px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .pg-output:empty {
      display: none;
    }

    .pg-output-line {
      padding: 4px 14px;
      font-family: var(--font-family-mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .pg-output-line--error {
      color: var(--error-color);
    }

    .pg-output-line--warn {
      color: var(--warn-color);
    }

    .pg-output-line--log {
      color: var(--log-color);
    }

    .pg-output-line--info {
      color: var(--app-text-color-secondary);
      border-top: 1px solid var(--app-border-color-primary);
      padding-top: 6px;
      margin-top: 2px;
    }

    /* --- footer --- */

    .pg-footer {
      display: none; /* shown on narrow layouts */
      padding: 8px 14px;
      font-size: 12px;
      color: var(--app-text-color-secondary);
      border-top: 1px solid var(--app-border-color-primary);
      background: var(--app-foreground-color);
    }

    .pg-footer a {
      color: var(--primary-button-background-color);
      text-decoration: none;
    }

    .pg-footer a:hover {
      text-decoration: underline;
    }

    /* --- narrow layout (< 768px): preview above, editor below --- */

    @media (max-width: 767px) {
      .pg-body {
        grid-template-columns: 1fr;
        grid-template-rows: 320px 1fr;
        height: auto;
        min-height: calc(100vh - 53px);
      }

      .pg-preview {
        border-right: none;
        border-bottom: 1px solid var(--app-border-color-primary);
        height: 320px;
      }

      .pg-editor-pane {
        min-height: 300px;
      }

      .CodeMirror {
        min-height: 300px;
      }

      .pg-footer {
        display: block;
      }

      .pg-header {
        gap: 10px;
      }

      .btn-group {
        margin-left: 0;
      }
    }

    @media (max-width: 479px) {
      .pg-title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header class="pg-header">
    <span class="pg-title">
      <a href="../" aria-label="Punter.js homepage">Punter.js</a> Playground
    </span>

    <div class="pg-controls">
      <div class="pg-select-wrap">
        <label for="pg-example-select">Example:</label>
        <select id="pg-example-select" aria-label="Select an example">
          <option value="move">Move a sprite</option>
          <option value="keyboard">Keyboard input</option>
          <option value="collision">Collision</option>
          <option value="pointer">Pointer input</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary"    id="pg-run-btn"      type="button">Run</button>
        <button class="btn btn-secondary"  id="pg-reset-btn"    type="button">Reset</button>
        <button class="btn btn-secondary"  id="pg-download-btn" type="button">Download</button>
      </div>
    </div>
  </header>

  <main class="pg-body">
    <section class="pg-preview" aria-label="Game preview">
      <!-- iframe is created here dynamically on Run -->
      <div class="pg-preview-placeholder" id="pg-placeholder" aria-hidden="true">
        Press Run to start the game
      </div>
    </section>

    <div class="pg-editor-pane">
      <div class="pg-editor-wrap" id="pg-editor-wrap">
        <label for="pg-textarea" class="visually-hidden">JavaScript code editor</label>
        <textarea
          id="pg-textarea"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="off"
          aria-label="JavaScript code editor"
        ></textarea>
      </div>

      <!-- error and console output -->
      <div
        class="pg-output"
        id="pg-output"
        role="log"
        aria-live="polite"
        aria-label="Output and error messages"
      ></div>
    </div>
  </main>

  <footer class="pg-footer">
    <a href="../">← Punter.js homepage</a>
  </footer>

  <!-- visually hidden utility -->
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <!-- CodeMirror 5: plain script tags, no ES modules required -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- playground logic (plain ES5) -->
  <script>
    (function () {
      'use strict';

      // --- constants ---

      var STORAGE_KEY = 'punter-playground-v2';

      // known example names — used to whitelist the ?learn= param (prevents path traversal)
      var KNOWN_EXAMPLES = ['move', 'keyboard', 'collision', 'pointer'];
      var DEFAULT_EXAMPLE = 'move';
      var KNOWN_GAMES = ['asteroids', 'breakout', 'first-game', 'platform', 'pong', 'snake', 'tetris'];

      // --- state ---

      var currentExample = DEFAULT_EXAMPLE;   // currently selected example name
      var originalCode = '';                   // code of the current example as loaded from file
      var previewFrame = null;                 // current iframe element
      var isGameMode = false;                  // true when a full game HTML file is loaded

      // --- element refs ---

      var selectEl    = document.getElementById('pg-example-select');
      var runBtn      = document.getElementById('pg-run-btn');
      var resetBtn    = document.getElementById('pg-reset-btn');
      var downloadBtn = document.getElementById('pg-download-btn');
      var outputEl    = document.getElementById('pg-output');
      var previewEl   = document.querySelector('.pg-preview');
      var placeholder = document.getElementById('pg-placeholder');

      // --- editor abstraction ---
      // Both functions work whether CodeMirror is loaded or not.

      function getCode() {
        if (window.playgroundEditor) {
          return window.playgroundEditor.getValue();
        }
        return document.getElementById('pg-textarea').value;
      }

      function setCode(code) {
        if (window.playgroundEditor) {
          window.playgroundEditor.setValue(code);
          return;
        }
        document.getElementById('pg-textarea').value = code;
      }

      // --- output helpers ---

      function clearOutput() {
        outputEl.innerHTML = '';
      }

      function appendOutput(text, cssClass) {
        var line = document.createElement('div');
        line.className = 'pg-output-line ' + cssClass;
        line.textContent = text;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      // --- load example from /learn/{name}.html ---

      function loadExample(name, callback) {
        // resolve to the repository root regardless of where the page is hosted
        var base = location.pathname.replace(/playground\/?.*$/, '');
        var url = base + 'learn/' + name + '.html';

        fetch(url).then(function (res) {
          if (!res.ok) throw new Error('Could not load example: ' + name);
          return res.text();
        }).then(function (html) {
          var code = extractScript(html);
          if (typeof callback === 'function') callback(null, code);
        }).catch(function (err) {
          if (typeof callback === 'function') callback(err, null);
        });
      }

      // strip the common leading whitespace from all non-empty lines
      function dedent(str) {
        var lines = str.split('\n');
        while (lines.length && lines[0].trim() === '') lines.shift();
        while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
        if (!lines.length) return '';
        var min = Infinity;
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].trim() === '') continue;
          var spaces = lines[i].match(/^(\s*)/)[1].length;
          if (spaces < min) min = spaces;
        }
        if (min === 0 || min === Infinity) return lines.join('\n');
        return lines.map(function (l) { return l.slice(min); }).join('\n');
      }

      // extract content of the last <script> without a src attribute
      function extractScript(html) {
        // use a temporary element to parse the HTML safely
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        var scripts = tmp.querySelectorAll('script:not([src])');
        if (!scripts.length) return '';
        return dedent(scripts[scripts.length - 1].textContent);
      }

      // --- load a full game HTML file ---

      function loadGame(name, callback) {
        var base = location.pathname.replace(/playground\/?.*$/, '');
        var url = base + 'games/' + name + '.html';

        fetch(url).then(function (res) {
          if (!res.ok) throw new Error('Could not load game: ' + name);
          return res.text();
        }).then(function (html) {
          if (typeof callback === 'function') callback(null, html);
        }).catch(function (err) {
          if (typeof callback === 'function') callback(err, null);
        });
      }

      // strip the "Edit in Playground" anchor (meta-link added to game files; not part of the game code)
      function stripEditLink(html) {
        return html.replace(/<a\b[^>]*>Edit in Playground<\/a>\s*/g, '');
      }

      function loadGameIntoEditor(name) {
        isGameMode = true;
        setEditorMode('htmlmixed');
        loadGame(name, function (err, html) {
          if (err) {
            appendOutput('Could not load game: ' + name, 'pg-output-line--error');
            return;
          }
          var cleaned = stripEditLink(html);
          originalCode = cleaned;
          setCode(cleaned);
          clearOutput();
          runGame();
        });
      }

      function setEditorMode(mode) {
        if (window.playgroundEditor) {
          window.playgroundEditor.setOption('mode', mode);
        }
      }

      // --- select and load an example ---

      function selectExample(name, forceLoad) {
        isGameMode = false;
        setEditorMode('javascript');
        // fall back to default for unknown names
        if (KNOWN_EXAMPLES.indexOf(name) === -1) name = DEFAULT_EXAMPLE;

        // confirm if the learner has unsaved changes (unless forced)
        if (!forceLoad && originalCode && getCode() !== originalCode) {
          if (!confirm('Replace your code with the "' + name + '" example?')) return;
        }

        currentExample = name;
        selectEl.value = name;

        loadExample(name, function (err, code) {
          if (err) {
            appendOutput('Could not load example: ' + name, 'pg-output-line--error');
            return;
          }
          originalCode = code;
          setCode(code);
          clearOutput();
          saveToStorage();
          runGame();
        });
      }

      // --- run the game in a sandboxed iframe ---

      function runGame() {
        clearOutput();

        var code = getCode();
        var html = isGameMode ? buildGameIframeDocument(code) : buildIframeDocument(code);

        // destroy old iframe so previous game loops and handlers are removed
        if (previewFrame) {
          previewFrame.remove();
          previewFrame = null;
        }

        placeholder.style.display = 'none';

        var frame = document.createElement('iframe');
        frame.title = 'Game preview';
        // game mode: allow-same-origin lets localStorage and same-origin fetch (sounds) work
        // learn mode: no allow-same-origin — isolates learner code from parent page
        frame.setAttribute('sandbox', isGameMode ? 'allow-scripts allow-same-origin' : 'allow-scripts');
        frame.srcdoc = html;

        previewEl.appendChild(frame);
        previewFrame = frame;

        // defer one tick so the button click doesn't steal focus back
        var capturedFrame = frame;
        setTimeout(function () { capturedFrame.focus(); }, 0);

        saveToStorage();
      }

      // build a complete HTML document to load into the iframe
      function buildIframeDocument(userCode) {
        // resolve the origin so relative game asset paths work (e.g. ../images/)
        var base = location.origin + location.pathname.replace(/playground\/?.*$/, '');

        // the bridge script captures errors and console output
        // LINE_OFFSET is the line number where the learner's code begins in the document
        // (used to display accurate line numbers in error messages)
        var BRIDGE_LINE_OFFSET = 18; // lines before user code in the iframe doc

        var bridge = [
          '(function () {',
          '  var OFFSET = ' + BRIDGE_LINE_OFFSET + ';',
          '  window.onerror = function (msg, url, line, col, err) {',
          '    parent.postMessage({ type: \'playground-error\', message: msg, line: line - OFFSET }, \'*\');',
          '    return true;',
          '  };',
          '  window.addEventListener(\'unhandledrejection\', function (e) {',
          '    parent.postMessage({ type: \'playground-error\', message: String(e.reason) }, \'*\');',
          '  });',
          '  [\'log\', \'warn\', \'error\'].forEach(function (m) {',
          '    var orig = console[m];',
          '    console[m] = function () {',
          '      var args = Array.prototype.slice.call(arguments);',
          '      parent.postMessage({ type: \'playground-console\', level: m, text: args.join(\' \') }, \'*\');',
          '      orig.apply(console, args);',
          '    };',
          '  });',
          '}());'
        ].join('\n');

        return [
          '<!doctype html>',
          '<html>',
          '<head>',
          '  <meta charset="utf-8">',
          '  <meta name="viewport" content="width=device-width, initial-scale=1">',
          // base href so ../images/ and ../sounds/ resolve correctly from punterjs.org/
          '  <base href="' + base + '">',
          '  <style>',
          '    * { margin: 0; padding: 0; box-sizing: border-box; }',
          '    html, body { width: 100%; height: 100%; overflow: hidden; background: #1b2125; }',
          '    canvas { display: block; }',
          '  </style>',
          '  <script src="src/punter.js"><\/script>',
          '</head>',
          '<body>',
          '<canvas id="game"></canvas>',
          '<script>',
          bridge,
          '<\/script>',
          '<script>',
          userCode,
          '<\/script>',
          '</body>',
          '</html>'
        ].join('\n');
      }
      // run a full game HTML file; injects base href so relative paths (../images/, ../src/punter.js) resolve
      function buildGameIframeDocument(html) {
        var base = location.origin + location.pathname.replace(/playground\/?.*$/, '') + 'games/';
        return html.replace('<head>', '<head>\n  <base href="' + base + '">');
      }
      // --- listen for messages from the iframe ---

      window.addEventListener('message', function (e) {
        // only accept messages from our own preview iframe
        if (!previewFrame || e.source !== previewFrame.contentWindow) return;

        var data = e.data;
        if (!data || typeof data.type !== 'string') return;

        if (data.type === 'playground-error') {
          var prefix = (typeof data.line === 'number' && data.line > 0)
            ? 'Line ' + data.line + ': '
            : 'Error: ';
          appendOutput(prefix + (data.message || 'Unknown error'), 'pg-output-line--error');
        }

        if (data.type === 'playground-console') {
          var cssClass = data.level === 'error' ? 'pg-output-line--error'
                       : data.level === 'warn'  ? 'pg-output-line--warn'
                       : 'pg-output-line--log';
          appendOutput(data.text || '', cssClass);
        }
      });

      // --- reset ---

      function resetExample() {
        if (!originalCode || getCode() === originalCode) {
          // no changes — just reload silently
          setCode(originalCode);
          runGame();
          return;
        }
        if (confirm('Reset to the original example? Your changes will be lost.')) {
          setCode(originalCode);
          runGame();
        }
      }

      // --- download ---

      function downloadGame() {
        var userCode = getCode();
        var html;

        if (isGameMode) {
          // fix the local engine path for standalone use; images/sounds still need a local server
          html = userCode.replace('../src/punter.js', 'https://punterjs.org/src/punter.js');
        } else {
          html = [
          '<!doctype html>',
          '<html>',
          '<head>',
          '  <title>My Punter.js Game</title>',
          '  <meta charset="utf-8">',
          '  <meta name="viewport" content="width=device-width, initial-scale=1">',
          '  <style>',
          '    * { margin: 0; padding: 0; box-sizing: border-box; }',
          '    html, body { width: 100%; height: 100%; overflow: hidden; background: #1b2125; }',
          '    canvas { display: block; }',
          '  </style>',
          '  <!-- Punter.js game engine -->',
          '  <script src="https://punterjs.org/src/punter.js"><\/script>',
          '</head>',
          '<body>',
          '<canvas id="game"></canvas>',
          '',
          '<!--',
          '  Edit your game code between the <script> tags below.',
          '  To use images or sounds, open this file through a local web server',
          '  rather than double-clicking it — browsers block local asset loading',
          '  from file:// URLs. Run: npx http-server . and open http://localhost:8080',
          '-->',
          '<script>',
          userCode,
          '<\/script>',
          '</body>',
          '</html>'
          ].join('\n');
        }

        var blob = new Blob([html], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'my-game.html';
        a.click();
        URL.revokeObjectURL(url);
      }

      // --- localStorage ---

      function saveToStorage() {
        if (isGameMode) return;
        try {
          var data = JSON.stringify({ code: getCode(), example: currentExample });
          localStorage.setItem(STORAGE_KEY, data);
        } catch (e) {
          // storage unavailable — non-fatal
        }
      }

      function loadFromStorage() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (typeof data.code !== 'string') return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      // --- URL parameter ---

      function getLearnParam() {
        var params = new URLSearchParams(location.search);
        var name = params.get('learn');
        if (!name) return null;
        // whitelist to prevent path traversal
        if (KNOWN_EXAMPLES.indexOf(name) === -1) return null;
        return name;
      }

      function getGameParam() {
        var params = new URLSearchParams(location.search);
        var name = params.get('game');
        if (!name) return null;
        // whitelist to prevent path traversal
        if (KNOWN_GAMES.indexOf(name) === -1) return null;
        return name;
      }

      // --- button events ---

      runBtn.addEventListener('click', function () {
        runGame();
      });

      resetBtn.addEventListener('click', function () {
        resetExample();
      });

      downloadBtn.addEventListener('click', function () {
        downloadGame();
      });

      selectEl.addEventListener('change', function () {
        selectExample(selectEl.value, false);
      });

      // auto-save on editor changes (debounced 1s)
      var saveTimer;
      function scheduleAutoSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveToStorage, 1000);
      }

      // auto-save fallback for plain textarea (when CodeMirror is unavailable)
      document.getElementById('pg-textarea').addEventListener('input', scheduleAutoSave);

      // --- initialise CodeMirror 5 ---
      // The codemirror.min.js script loads before this block so CodeMirror is available globally.
      // fromTextArea replaces the textarea in-place; its current value is used as initial content.
      if (window.CodeMirror) {
        window.playgroundEditor = CodeMirror.fromTextArea(
          document.getElementById('pg-textarea'),
          {
            mode: 'javascript',
            theme: 'dracula',
            lineNumbers: true,
            lineWrapping: false,
            indentWithTabs: false,
            tabSize: 2,
            matchBrackets: true,
            autofocus: false,
            extraKeys: {
              Tab: function (cm) { cm.replaceSelection('  '); }
            }
          }
        );
        window.playgroundEditor.on('change', scheduleAutoSave);
      }

      // --- initialise on load ---

      function init() {
        var gameParam = getGameParam();
        var learnParam = getLearnParam();
        var stored = loadFromStorage();

        if (gameParam) {
          // ?game= param loads a full game HTML file into the editor
          loadGameIntoEditor(gameParam);
        } else if (learnParam) {
          // URL param takes priority
          selectExample(learnParam, true);
        } else if (stored && KNOWN_EXAMPLES.indexOf(stored.example) !== -1) {
          // restore from localStorage — load the original, then overwrite with saved code
          currentExample = stored.example;
          selectEl.value = stored.example;
          loadExample(stored.example, function (err, original) {
            if (err) {
              selectExample(DEFAULT_EXAMPLE, true);
              return;
            }
            originalCode = original;
            setCode(stored.code);
            clearOutput();
            runGame();
          });
        } else {
          selectExample(DEFAULT_EXAMPLE, true);
        }
      }

      init();

    }());
  </script>

</body>
</html>
